# Distances the server uses when it is running well.
view-distance:
  max: 8
  min: 6
simulation-distance:
  max: 6
  min: 4

# 50 ms per tick is the limit before the server drops below 20 TPS.
lag-mspt: 45.0
healthy-mspt: 30.0

# How long tick time must stay above/below those numbers before changing anything.
seconds-before-lowering: 5
seconds-before-raising: 60
